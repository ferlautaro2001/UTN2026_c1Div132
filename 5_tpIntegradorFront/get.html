<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">

    <!-- Preset CSS -->
    <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura-vader.css" type="text/css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-container">
                <img src="assets/img/pumpernic-cuadrado.png" alt="logo pumpernic">
            </a>
        </div>

        <ul class="enlaces">
            <li class="enlace">
                <a href="index.html">
                    <span>VER</span>
                </a>
            </li>

            <li class="enlace">
                <a href="get.html">
                    <span>CONSULTAR</span>
                </a>
            </li>

            <li class="enlace">
                <a href="post.html">
                    <span>CREAR</span>
                </a>
            </li>

            <li class="enlace">
                <a href="put.html">
                    <span>MODIFICAR</span>
                </a>
            </li>

            <li class="enlace">
                <a href="delete.html">
                    <span>ELIMINAR</span>
                </a>
            </li>
        </ul>
    </header>

    <main>

        <section class="form-productos">
            <h2>Consultar producto por id: </h2>
            
            <form id="getProduct-form">
                <label for="idProd">Id del producto</label>
                <input type="number" name="idProd" id="idProd" required>

                <input type="submit" value="Consultar producto">
            </form>
        </section>

        <section class="secccion-productos">
            <hr>
            <div id="contenedor-productos">
                <!-- 
                    <ul>
                        <li class="lista-producto">
                            <img src="https://pointlaventanita.com/wp-content/uploads/2024/05/chabona.webp" alt="Fernet Cola Chabona">
                            <p>Id: 41 / Nombre: Fernet Cola Chabona / <strong>Precio: $4200</strong></p>
                        </li>
                    </ul>
                 -->
            </div>
        </section>
    </main>

    <script>
        const contenedorProductos = document.getElementById("contenedor-productos");
        const getProductForm = document.getElementById("getProduct-form");
        const urlBase = "http://localhost:3000/api/products";

        
        getProductForm.addEventListener("submit", async event => {
            event.preventDefault(); // Evitamos el envio por defecto del formulario

            // Optimizacion 1: Para extraer solamente un valor, como el id en nuestro miniformulario, podemos saltarnos el FormData + Object.fromEntries
            const idProd = event.target.idProd.value.trim();

            // Optimizacion 2: Nos aseguramos de que se haya enviado un id valido
            if (!idProd) {
                mostrarError("Ingresá un id válido");
                return;
            }
            
            /*
            // Creo un objeto nativo FormData a partir del formulario del evento
            const formData = new FormData(event.target);
            console.log(formData); // FormData { idProd → "1" }

            // Transformo mi objeto nativo FormData en un objeto normal JS
            const data = Object.fromEntries(formData.entries());
            console.log(data); // Object { idProd: "1" }
            const idProd = data.idProd; // 1
            */


            try {
                // Optimizacion 3: Guardamos en una variable aparte la URL base para no hardcodearla aca
                const response = await fetch(`${urlBase}/${idProd}`);
                console.log(response);

                const data = await response.json();

                // Optimizacion 4: Mostramos por pantalla el error (400 o 500) que nos devuelve el servidor
                if (!response.ok) {
                    mostrarError(data.message);
                    return;
                }

                console.log(data.payload[0]); // {id: 41, name: 'Fernetazo Chabona', image: 'https://pointlaventanita.com/wp-content/uploads/2024/05/chabona.webp', category: 'drink', price: '2300.00', …}

                const producto = data.payload[0];

                const htmlProducto = `
                    <ul>
                        <li class="lista-producto">
                            <img src="${producto.image}" alt="${producto.name}">
                            <p>Id: ${producto.id} / Nombre: ${producto.name} / <strong>Precio: $${producto.price}</strong></p>
                        </li>
                    </ul>
                `;

                contenedorProductos.innerHTML = htmlProducto;

            } catch (error) {
                console.error("Error al obtener productos: ", error);

                // Optimizacion 5: Mostramos errores de red (en el try catch del fetch no capturamos errores 400 o 500)
                mostrarError("Error de conexion con el servidor")
            }
        })

        function mostrarError(mensaje) {
            contenedorProductos.innerHTML = `
                <p class="mensaje mensaje-error">${mensaje}</p>
            `;
        }
    </script>
    
</body>
</html>
